name: Landing page search
on:
  schedule:
    - cron: "0 7 * * *"
      timezone: America/Chicago
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-news-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: ${{ vars.NEWS_RELEASE_FUNCTION != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.NEWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: npm run cli -- sources daily com/serpapi/landing-page-search
        env:
          NEWS_RELEASE_FUNCTION: ${{ vars.NEWS_RELEASE_FUNCTION }}
          NEWS_PRIVATE_BUCKET: ${{ vars.NEWS_PRIVATE_BUCKET }}
          NEWS_SITE_BUCKET: ${{ vars.NEWS_SITE_BUCKET }}
          NEWS_DISTRIBUTION_ID: ${{ vars.NEWS_DISTRIBUTION_ID }}
          NEWS_SITE_ORIGIN: ${{ vars.NEWS_SITE_ORIGIN }}
          SEARCH_CONSOLE_PROPERTY: ${{ vars.SEARCH_CONSOLE_PROPERTY }}
          SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.SEARCH_CONSOLE_CREDENTIALS }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NEWS_INFERENCE_URL: ${{ vars.NEWS_INFERENCE_URL }}
          NEWS_INFERENCE_MODEL: ${{ vars.NEWS_INFERENCE_MODEL }}
          NEWS_INFERENCE_API_KEY: ${{ secrets.NEWS_INFERENCE_API_KEY }}
