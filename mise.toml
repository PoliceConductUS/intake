[tools]
node = "26.13.1"
gh = "2.104.0"
uv = "0.13.8"
"conda:poppler" = "26.11.0"
"conda:tesseract" = "5.5.4"

[env]
DO_NOT_TRACK = "1"
SUPABASE_TELEMETRY_DISABLED = "1"
TMPDIR = false
UV_CACHE_DIR = ".cache/uv"
UV_TOOL_DIR = ".cache/uv-tools"
# The dev intake workspace, which sits beside the repo folder that holds this
# branch folder. Override for preview/prod.
INTAKE_WORKSPACE = "{{config_root}}/../../intake-workspace/dev"
