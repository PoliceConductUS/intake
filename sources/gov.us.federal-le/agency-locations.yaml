# Curated headquarters locations for federal law-enforcement agencies.
#
# The Wikipedia list gives the agency/parent structure but no addresses, and an
# Agency needs a geocodable location (address/city/state/zip -> location_path).
# `run` joins each parsed agency to an entry here by slug; agencies with no entry
# are reported and skipped (never fabricated). Add an entry to import one.
#
# `name` is the canonical agency name emitted to the Agency record; `slug` is the
# join key (slugify of the Wikipedia link text). Keep this list curated by hand.
agencies:
  - slug: federal-bureau-of-investigation
    name: Federal Bureau of Investigation (FBI)
    state: DC
    city: Washington
    address: 935 Pennsylvania Avenue NW
    zip_code: "20535"
